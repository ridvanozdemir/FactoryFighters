name: Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check game source
        run: test -s www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: npm run android:prepare
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FactoryFighters-v0.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FactoryFighters-v0.5-debug
          path: dist/FactoryFighters-v0.5-debug.apk
          if-no-files-found: error
          retention-days: 14
